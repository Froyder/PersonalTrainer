name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "gemini_api_key=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Create ApiConfig files
        run: |
          mkdir -p composeApp/src/iosMain/kotlin/com/froyder/personaltrainer/data/remote
          mkdir -p composeApp/src/androidMain/kotlin/com/froyder/personaltrainer/data/remote
          
          cat > composeApp/src/iosMain/kotlin/com/froyder/personaltrainer/data/remote/ApiConfig.ios.kt << 'EOF'
          package com.froyder.personaltrainer.data.remote
          actual fun getGeminiApiKey(): String = "${{ secrets.GEMINI_API_KEY }}"
          EOF
          
          cat > composeApp/src/androidMain/kotlin/com/froyder/personaltrainer/data/remote/ApiConfig.android.kt << 'EOF'
          package com.froyder.personaltrainer.data.remote
          actual fun getGeminiApiKey(): String = "${{ secrets.GEMINI_API_KEY }}"
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :composeApp:jvmTest

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: composeApp/build/reports/tests/jvmTest/